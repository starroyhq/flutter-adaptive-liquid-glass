name: Native color first-use diagnostics

on:
  push:
    branches:
      - codex/native-accessibility
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-palette:
    name: First palette — ${{ matrix.arm }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Separate jobs provide fresh hosts and simulators. Running these tests
      # sequentially on one simulator would confound first-use service state.
      matrix:
        include:
          - arm: original-catalog
            test: RunnerUITests/NativeAccessibilityUITests/testCatalogColorPickerReopensAfterNativeTabRecreation
          - arm: matched-probe
            test: RunnerUITests/NativeFirstPaletteUITests/testFirstMatchedProbePaletteSelectsBlackOnce
          - arm: uikit-baseline
            test: RunnerUITests/NativeColorBaselineUITests/testFirstUIKitColorPaletteSelectsBlack
          - arm: uikit-plain
            test: RunnerUITests/NativeColorBaselineUITests/testFirstUIKitColorPaletteSelectsBlack
          - arm: uikit-bare-subclass
            test: RunnerUITests/NativeColorBaselineUITests/testFirstUIKitColorPaletteSelectsBlack
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and record toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - name: Generate default Flutter iOS configuration
        if: matrix.arm != 'matched-probe'
        run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - name: Generate catalog-matched probe configuration
        if: matrix.arm == 'matched-probe'
        run: >-
          flutter build ios --simulator --debug --config-only --no-pub
          --dart-define=GLASS_MATCH_CATALOG_COLOR=true
        working-directory: example
      - run: pod install --deployment
        working-directory: example/ios
      - name: Build standalone UIKit control app
        if: matrix.arm == 'uikit-baseline' || matrix.arm == 'uikit-plain' || matrix.arm == 'uikit-bare-subclass'
        run: bash example/ios/ColorPickerBaseline/build.sh
      - name: Select the unmodified UIKit controller for the plain arm
        if: matrix.arm == 'uikit-plain'
        run: |
          baseline_app=example/build/color-picker-baseline/ColorPickerBaseline.app
          /usr/libexec/PlistBuddy -c 'Add :GlassUsePlainColorPicker bool true' "$baseline_app/Info.plist"
          codesign --force --sign - --timestamp=none "$baseline_app"
      - name: Select the bare UIKit subclass without lifecycle overrides
        if: matrix.arm == 'uikit-bare-subclass'
        run: |
          baseline_app=example/build/color-picker-baseline/ColorPickerBaseline.app
          /usr/libexec/PlistBuddy -c 'Add :GlassUseBareColorPickerSubclass bool true' "$baseline_app/Info.plist"
          codesign --force --sign - --timestamp=none "$baseline_app"
      - name: Create and verify a dedicated iOS 26.5 simulator
        id: simulator
        env:
          GLASS_DIAGNOSTIC_ARM: ${{ matrix.arm }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          def simctl(*args):
              return subprocess.check_output(['xcrun', 'simctl', *args], text=True)

          candidates = [
              runtime for runtime in json.loads(simctl('list', 'runtimes', '--json'))['runtimes']
              if runtime.get('isAvailable')
              and runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')
              and runtime['version'].split('.')[:2] == ['26', '5']
          ]
          if not candidates:
              raise SystemExit('No available iOS 26.5 runtime is installed; do not substitute or download a runtime.')
          runtime = max(candidates, key=lambda item: tuple(map(int, item['version'].split('.'))))
          runtime_id = runtime['identifier']
          name = 'Liquid Glass First Palette ' + os.environ['GITHUB_RUN_ID'] + ' ' + os.environ['GLASS_DIAGNOSTIC_ARM']
          device_id = simctl('create', name, 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro', runtime_id).strip()
          # Persist ownership before boot so cleanup also handles a boot failure.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'device_id={device_id}\n')
          subprocess.run(['xcrun', 'simctl', 'boot', device_id], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device_id, '-b'], check=True)
          devices = json.loads(simctl('list', 'devices', '--json'))['devices']
          device = next((item for item in devices.get(runtime_id, []) if item['udid'] == device_id), None)
          if not device or device['state'] != 'Booted':
              raise SystemExit('The dedicated device did not boot on the selected iOS 26.5 runtime.')
          version_file = Path(runtime['runtimeRoot']) / 'System/Library/CoreServices/SystemVersion.plist'
          with version_file.open('rb') as source:
              system_version = plistlib.load(source)
          version = system_version['ProductVersion']
          if version.split('.')[:2] != ['26', '5']:
              raise SystemExit(f'Runtime verification failed: expected iOS 26.5, found {version}.')
          build = system_version['ProductBuildVersion']
          destination = f'iPhone 17 Pro, iOS {version} ({build}), arm64'
          print(f'First-palette destination: {destination}, {device_id}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"First palette ({os.environ['GLASS_DIAGNOSTIC_ARM']}): {destination}.\n")
          PY
      - name: Install the UIKit control app without launching it
        if: matrix.arm == 'uikit-baseline' || matrix.arm == 'uikit-plain' || matrix.arm == 'uikit-bare-subclass'
        env:
          GLASS_SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        run: >-
          xcrun simctl install "$GLASS_SIMULATOR_ID"
          example/build/color-picker-baseline/ColorPickerBaseline.app
      - name: Run only the first-palette scenario
        # Do not warm up the palette, retry failures, or run another test first.
        # Preserve XCTest's own recordings and verbose failure diagnostics in
        # xcresult; no additional screen-recording process changes the workload.
        run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme NativeSliderAcceptance
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR_ID"
          -derivedDataPath ../build/ios-native-color-diagnostics
          -resultBundlePath ../build/native-color-diagnostics.xcresult
          -only-testing:"$GLASS_ONLY_TEST"
          -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1
          -collect-test-diagnostics on-failure
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
        env:
          GLASS_SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
          GLASS_ONLY_TEST: ${{ matrix.test }}
        working-directory: example/ios
      - name: Preserve complete diagnostic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-color-${{ matrix.arm }}-xcresult
          path: example/build/native-color-diagnostics.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this job's dedicated simulator
        if: ${{ always() && steps.simulator.outputs.device_id != '' }}
        env:
          GLASS_SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcrun simctl shutdown "$GLASS_SIMULATOR_ID" || true
          xcrun simctl delete "$GLASS_SIMULATOR_ID"

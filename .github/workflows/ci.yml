name: Component checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze --no-pub
      - run: flutter analyze --no-pub
        working-directory: example
      - run: flutter test --no-pub --coverage
      - run: flutter test --no-pub
        working-directory: example

  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: android-example-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    needs: quality
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - run: pod install --deployment
        working-directory: example/ios
      # Pin the simulator architecture to avoid the Flutter toolchain's combined
      # arm64/x86_64 architecture parsing issue while compiling native controls.
      - run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/ios-ci
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
        working-directory: example/ios
      # Preserve executable permissions inside the downloadable application.
      - run: >-
          tar -czf build/ios-simulator-app.tar.gz
          -C build/ios-ci/Build/Products/Debug-iphonesimulator Runner.app
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: ios-example-simulator-app
          path: example/build/ios-simulator-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  native-interaction:
    needs: quality
    # The public label for the macos-26-arm64 image is macos-26; Xcode 27 and
    # its iOS 27 simulators are on the separate xcode-27 image.
    # https://github.com/actions/runner-images#available-images
    strategy:
      fail-fast: false
      matrix:
        ios: ['26', '27']
        suite: [controls, palette]
        include:
          - ios: '26'
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
          - ios: '27'
            runner: xcode-27
            xcode: /Applications/Xcode_27.1.app
    name: native-interaction (iOS ${{ matrix.ios }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      GLASS_IOS_MAJOR: ${{ matrix.ios }}
      GLASS_NATIVE_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Select Xcode
        run: |
          sudo xcode-select -s "${{ matrix.xcode }}"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - run: pod install --deployment
        working-directory: example/ios
      - name: Build native interaction tests
        run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme NativeSliderAcceptance
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/ios-native-interaction
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build-for-testing
        working-directory: example/ios
      - name: Run native interaction tests
        run: python3 .github/scripts/native-interaction.py
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.ios }}-${{ matrix.suite }}-native-interaction-xcresult
          path: example/build/native-interaction/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  # The jobs above pin the reference toolchain and build iOS through CocoaPods.
  # The *-stable jobs follow the current stable channel, where Flutter 3.44+
  # integrates iOS plugins through Swift Package Manager by default. They upload
  # no artifacts; release assets come from the pinned jobs.
  quality-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter_test pins SDK packages that change with every Flutter release,
      # so the committed lockfiles only resolve on the pinned version.
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      # Recent stable SDKs flag legacy Material imports as informational.
      # Keep reporting them while testing supported SDKs without a separate dependency.
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter analyze --no-pub --no-fatal-infos
        working-directory: example
      - run: flutter test --no-pub
      - run: flutter test --no-pub
        working-directory: example

  # Builds with Xcode 27 (iOS 27 SDK) while the pinned ios-simulator job keeps
  # Xcode 26.6, so the native code compiles against both SDKs. Xcode 27 is not
  # on the macos-26 image; it has its own image, labelled by Xcode version.
  # https://github.com/actions/runner-images#available-images
  ios-simulator-stable:
    needs: quality-stable
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      # The Flutter tool links a path-dependency plugin's Swift package under
      # the plugin directory's name, and SwiftPM rejects it when that name
      # differs from the package's own directory. Check out under the package
      # name instead of the repository name.
      - uses: actions/checkout@v4
        with:
          path: flutter_adaptive_liquid_glass
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_adaptive_liquid_glass
      - run: flutter pub get
        working-directory: flutter_adaptive_liquid_glass/example
      # With Swift Package Manager enabled this also adds the generated plugin
      # package to the Runner project.
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: flutter_adaptive_liquid_glass/example
      - name: Require the Swift Package Manager integration
        run: grep -q FlutterGeneratedPluginSwiftPackage Runner.xcodeproj/project.pbxproj
        working-directory: flutter_adaptive_liquid_glass/example/ios
      # Same architecture pin as the CocoaPods job above.
      - run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/ios-ci-spm
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
        working-directory: flutter_adaptive_liquid_glass/example/ios
      # SwiftPM names a target's resource bundle <package>_<target>.bundle;
      # a CocoaPods build would add flutter_adaptive_liquid_glass_privacy.bundle.
      - name: Require the plugin to come from its Swift package
        run: |
          app=build/ios-ci-spm/Build/Products/Debug-iphonesimulator/Runner.app
          test -n "$(find "$app" -path '*/flutter_adaptive_liquid_glass_flutter_adaptive_liquid_glass.bundle/PrivacyInfo.xcprivacy')"
          test -z "$(find "$app" -name 'flutter_adaptive_liquid_glass_privacy.bundle')"
        working-directory: flutter_adaptive_liquid_glass/example

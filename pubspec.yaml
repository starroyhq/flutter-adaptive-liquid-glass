name: flutter_adaptive_liquid_glass
description: Adaptive Liquid Glass controls for Flutter with isolated native iOS rendering.
repository: https://github.com/starroyhq/flutter-adaptive-liquid-glass
issue_tracker: https://github.com/starroyhq/flutter-adaptive-liquid-glass/issues
version: 0.5.2

topics:
  - liquid-glass
  - glassmorphism
  - ios
  - ui
  - widget

platforms:
  android:
  ios:

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        pluginClass: FlutterAdaptiveLiquidGlassPlugin

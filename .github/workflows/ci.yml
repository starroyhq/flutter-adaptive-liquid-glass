name: Component checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze --no-pub
      - run: flutter analyze --no-pub
        working-directory: example
      - run: flutter test --no-pub --coverage
      - run: flutter test --no-pub
        working-directory: example

  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: android-example-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    needs: quality
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - run: pod install --deployment
        working-directory: example/ios
      # Pin the simulator architecture to avoid the Flutter toolchain's combined
      # arm64/x86_64 architecture parsing issue while compiling native controls.
      - run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/ios-ci
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
        working-directory: example/ios
      # Preserve executable permissions inside the downloadable application.
      - run: >-
          tar -czf build/ios-simulator-app.tar.gz
          -C build/ios-ci/Build/Products/Debug-iphonesimulator Runner.app
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: ios-example-simulator-app
          path: example/build/ios-simulator-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  native-interaction:
    needs: quality
    # The public label for the macos-26-arm64 image is macos-26.
    # https://github.com/actions/runner-images#available-images
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require an arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: example
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - run: pod install --deployment
        working-directory: example/ios
      - name: Create and verify a dedicated iOS 26 simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          def simctl(*args):
              return subprocess.check_output(['xcrun', 'simctl', *args], text=True)

          candidates = [
              runtime for runtime in json.loads(simctl('list', 'runtimes', '--json'))['runtimes']
              if runtime.get('isAvailable')
              and runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')
              and runtime['version'].split('.')[0] == '26'
          ]
          if not candidates:
              raise SystemExit('No available iOS 26 runtime is installed; do not substitute iOS 27 or download a runtime.')
          runtime = max(candidates, key=lambda item: tuple(map(int, item['version'].split('.'))))
          runtime_id = runtime['identifier']
          device_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
          name = 'Liquid Glass Native Interaction ' + os.environ['GITHUB_RUN_ID']
          device_id = simctl('create', name, device_type, runtime_id).strip()
          # Save ownership before booting so the always-cleanup step also runs
          # if boot or runtime verification fails.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'device_id={device_id}\n')
          subprocess.run(['xcrun', 'simctl', 'boot', device_id], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device_id, '-b'], check=True)
          devices = json.loads(simctl('list', 'devices', '--json'))['devices']
          device = next((item for item in devices.get(runtime_id, []) if item['udid'] == device_id), None)
          if not device or device['state'] != 'Booted':
              raise SystemExit('The dedicated device did not boot on the selected iOS 26 runtime.')
          system_version = Path(runtime['runtimeRoot']) / 'System/Library/CoreServices/SystemVersion.plist'
          with system_version.open('rb') as source:
              version = plistlib.load(source)['ProductVersion']
          if version.split('.')[0] != '26':
              raise SystemExit(f'Runtime verification failed: expected iOS 26, found {version}.')
          print(f'Native interaction destination: iPhone 17 Pro, iOS {version}, {device_id}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Native interaction: dedicated iPhone 17 Pro simulator, iOS {version}, arm64.\n')
          PY
      - name: Test native slider and accessibility interaction
        run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme NativeSliderAcceptance
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR_ID"
          -derivedDataPath ../build/ios-native-interaction
          -resultBundlePath ../build/native-interaction.xcresult
          -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1
          -collect-test-diagnostics never
          -only-testing:RunnerUITests/NativeAccessibilityUITests
          -only-testing:RunnerUITests/NativeSliderUITests
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
        env:
          GLASS_SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        working-directory: example/ios
      - name: Require palette cases that actually ran
        # A case whose first system palette never appears is skipped as the
        # known first-use limitation. The gate still fails if every palette
        # case was skipped, so a palette that never appears cannot pass.
        run: |
          xcrun xcresulttool get test-results tests --path ../build/native-interaction.xcresult --format json > "$RUNNER_TEMP/tests.json"
          python3 - "$RUNNER_TEMP/tests.json" <<'PY'
          import json
          import os
          import sys

          palette_cases = 8
          skipped = []

          def walk(node):
              if node.get('nodeType') == 'Test Case' and node.get('result') == 'Skipped':
                  skipped.append(node['name'])
              for child in node.get('children', []):
                  walk(child)

          for node in json.load(open(sys.argv[1]))['testNodes']:
              walk(node)
          lines = [f'Skipped palette cases (first-use limitation): {len(skipped)} of {palette_cases}']
          lines += [f'- {name}' for name in skipped]
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          if len(skipped) >= palette_cases:
              raise SystemExit('Every palette case was skipped; the system palette never appeared.')
          PY
        working-directory: example/ios
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-26-native-interaction-xcresult
          path: example/build/native-interaction.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the dedicated simulator
        if: ${{ always() && steps.simulator.outputs.device_id != '' }}
        env:
          GLASS_SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcrun simctl shutdown "$GLASS_SIMULATOR_ID" || true
          xcrun simctl delete "$GLASS_SIMULATOR_ID"

  # The jobs above pin the reference toolchain and build iOS through CocoaPods.
  # The *-stable jobs follow the current stable channel, where Flutter 3.44+
  # integrates iOS plugins through Swift Package Manager by default. They upload
  # no artifacts; release assets come from the pinned jobs.
  quality-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter_test pins SDK packages that change with every Flutter release,
      # so the committed lockfiles only resolve on the pinned version.
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --no-pub
      - run: flutter analyze --no-pub
        working-directory: example
      - run: flutter test --no-pub
      - run: flutter test --no-pub
        working-directory: example

  ios-simulator-stable:
    needs: quality-stable
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      # With Swift Package Manager enabled this also adds the generated plugin
      # package to the Runner project.
      - run: flutter build ios --simulator --debug --config-only --no-pub
        working-directory: example
      - name: Require the Swift Package Manager integration
        run: grep -q FlutterGeneratedPluginSwiftPackage Runner.xcodeproj/project.pbxproj
        working-directory: example/ios
      # Same architecture pin as the CocoaPods job above.
      - run: >-
          xcodebuild -workspace Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../build/ios-ci-spm
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
        working-directory: example/ios
      # SwiftPM names a target's resource bundle <package>_<target>.bundle;
      # a CocoaPods build would add flutter_adaptive_liquid_glass_privacy.bundle.
      - name: Require the plugin to come from its Swift package
        run: |
          app=build/ios-ci-spm/Build/Products/Debug-iphonesimulator/Runner.app
          test -n "$(find "$app" -path '*/flutter_adaptive_liquid_glass_flutter_adaptive_liquid_glass.bundle/PrivacyInfo.xcprivacy')"
          test -z "$(find "$app" -name 'flutter_adaptive_liquid_glass_privacy.bundle')"
        working-directory: example
